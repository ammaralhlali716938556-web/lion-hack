name: Build Ammar Al-Hilali MikroTik Helper APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/ammar/mikrotik
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AmmarAlHilaliHelper'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ammar.mikrotik'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.ammar.mikrotik'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
              }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Ammar Al-Hilali"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ammar/mikrotik/MainActivity.java <<'EOF'
          package com.ammar.mikrotik;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public final class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(false);

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  WebView webView = (WebView) findViewById(android.R.id.content);
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Create application interface
        shell: bash
        run: |
          set -euo pipefail



                function startApp() {
                    const link = document.getElementById('networkLink').value;
                    if(!link) return alert("Enter a Network Link");
                    
                    const iframe = document.getElementById('displayWindow');
                    iframe.src = link;
                    iframe.style.display = 'block';
                    
                    // Start the guessing process
                    runGuessingLoop();
                }

                async function runGuessingLoop() {
                    isRunning = true;
                    const btn = document.querySelector('button');
                    btn.disabled = true;
                    const prefix = document.getElementById('cardPrefix').value;
                    const totalDigits = parseInt(document.getElementById('numDigits').value);
                    const maxAttempts = parseInt(document.getElementById('guessAttempts').value);
                    const statusEl = document.getElementById('statusMsg');
                    
                    let attempts = 0;

                    while(attempts < maxAttempts && isRunning) {
                        // Generate Random Code
                        const remaining = totalDigits - prefix.length;
                        let rand = "";
                        for(let i=0; i<remaining; i++) rand += Math.floor(Math.random()*10);
                        const candidate = prefix + rand;

                        statusEl.innerText = `Testing: ${candidate}`;
                        
                        // Simulate Network Check (Sequential)
                        await new Promise(r => setTimeout(r, 800)); // Slow sequential check
                        
                        // Simulate Success (Random chance for demo)
                        const success = Math.random() < 0.15; 

                        if(success) {
                            document.getElementById('acceptedCard').value = candidate;
                            statusEl.innerText = "SUCCESS! Card Accepted.";
                            isRunning = false;
                            break;
                        } else {
                            attempts++;
                            document.getElementById('currentAttempts').value = `${attempts} / ${maxAttempts}`;
                            
                            // Anti-Ban: Reset after each attempt to bypass 4-attempt block
                            if(attempts % ANTI_BAN_THRESHOLD === 0) {
                                statusEl.innerText += " (Anti-Ban Reset)";
                                console.log("Resetting session...");
                            }
                        }
                    }
                    
                    btn.disabled = false;
                    if(!isRunning && attempts >= maxAttempts) {
                        statusEl.innerText = "Max Attempts Reached.";
                    }
                }
            </script>
        </body>
        </html>
        HTMLEOF

    - name: Build APK
      run: gradle wrapper && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AmmarAlHilali-App
        path: app/build/outputs/apk/debug/app-debug.apk
