name: Build Ammar Al-Hilali MikroTik Generator APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
       

    - name: Create Project Structure
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/build/outputs/apk/debug
        
        # 1. Create AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.ammar.mikrotik">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="MikroTik Gen"
                android:theme="@style/AppTheme">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. Create MainActivity.java (Simple WebView Host)
        cat > app/src/main/java/com/ammar/mikrotik/MainActivity.java << 'EOF'
        package com.ammar.mikrotik;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                setContentView(webView);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                // Load the embedded HTML file
                webView.loadUrl("file:///android_asset/index.html");
            }
        }
        EOF

        # 3. Create build.gradle (Project level)
        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google() mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects { repositories { google() mavenCentral() } }
        EOF

        # 4. Create build.gradle (App level)
        cat > app/build.gradle << 'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.ammar.mikrotik'
            compileSdk 33
            defaultConfig { applicationId "com.ammar.mikrotik" minSdk 21 targetSdk 33 versionCode 1 versionName "1.0" }
            buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17 }
        }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
        EOF

        # 5. Create settings.gradle
        cat > settings.gradle << 'EOF'
        rootProject.name = "MikroTikGenerator"
        include ':app'
        EOF

    - name: Generate index.html (The Core Application)
      run: |
        cat > app/src/main/assets/index.html << 'HTMLEOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ammar Al-Hilali</title>
            <style>
                :root { --primary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; }
                body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
                h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
                .field { background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 5px; }
                label { font-size: 0.9rem; color: #94a3b8; }
                input, button { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #334155; color: white; font-size: 1rem; }
                input:focus { outline: none; border-color: var(--primary); }
                button { background: linear-gradient(90deg, #3a7bd5, #00d2ff); border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
                button:disabled { opacity: 0.6; cursor: not-allowed; }
                iframe { width: 100%; height: 300px; background: white; border-radius: 10px; margin-top: 20px; display: none; }
                .status { text-align: center; margin-top: 10px; color: var(--primary); font-size: 0.9rem; }
            </style>
        </head>
        <body>
            <h1>Ammar Al-Hilali</h1>

            <!-- 1. Network Link -->
            <div class="field">
                <label>Network Link</label>
                <input type="text" id="networkLink" placeholder="Paste MikroTik URL here">
                <button onclick="startApp()">Start & Open Window</button>
            </div>

            <!-- 2. Card Prefix -->
            <div class="field">
                <label>Card Prefix</label>
                <input type="text" id="cardPrefix" placeholder="e.g., 1 or 12">
            </div>

            <!-- 3. Number of Digits -->
            <div class="field">
                <label>Number of Digits</label>
                <input type="number" id="numDigits" value="8">
            </div>

            <!-- 4. Guessing Attempts -->
            <div class="field">
                <label>Guessing Attempts</label>
                <input type="number" id="guessAttempts" value="50">
            </div>

            <!-- 5. Attempts So Far -->
            <div class="field">
                <label>Attempts So Far</label>
                <input type="text" id="currentAttempts" readonly value="0 / 0">
            </div>

            <!-- 6. Accepted Card -->
            <div class="field">
                <label>Accepted Card Number</label>
                <input type="text" id="acceptedCard" readonly placeholder="Waiting..." style="color: #4ade80;">
            </div>

            <!-- WebView Display Window -->
            <iframe id="displayWindow"></iframe>
            <div class="status" id="statusMsg">Ready</div>

            <script>
                const ANTI_BAN_THRESHOLD = 4; // Block after 4 tries
                let isRunning = false;

                function startApp() {
                    const link = document.getElementById('networkLink').value;
                    if(!link) return alert("Enter a Network Link");
                    
                    const iframe = document.getElementById('displayWindow');
                    iframe.src = link;
                    iframe.style.display = 'block';
                    
                    // Start the guessing process
                    runGuessingLoop();
                }

                async function runGuessingLoop() {
                    isRunning = true;
                    const btn = document.querySelector('button');
                    btn.disabled = true;
                    const prefix = document.getElementById('cardPrefix').value;
                    const totalDigits = parseInt(document.getElementById('numDigits').value);
                    const maxAttempts = parseInt(document.getElementById('guessAttempts').value);
                    const statusEl = document.getElementById('statusMsg');
                    
                    let attempts = 0;

                    while(attempts < maxAttempts && isRunning) {
                        // Generate Random Code
                        const remaining = totalDigits - prefix.length;
                        let rand = "";
                        for(let i=0; i<remaining; i++) rand += Math.floor(Math.random()*10);
                        const candidate = prefix + rand;

                        statusEl.innerText = `Testing: ${candidate}`;
                        
                        // Simulate Network Check (Sequential)
                        await new Promise(r => setTimeout(r, 800)); // Slow sequential check
                        
                        // Simulate Success (Random chance for demo)
                        const success = Math.random() < 0.15; 

                        if(success) {
                            document.getElementById('acceptedCard').value = candidate;
                            statusEl.innerText = "SUCCESS! Card Accepted.";
                            isRunning = false;
                            break;
                        } else {
                            attempts++;
                            document.getElementById('currentAttempts').value = `${attempts} / ${maxAttempts}`;
                            
                            // Anti-Ban: Reset after each attempt to bypass 4-attempt block
                            if(attempts % ANTI_BAN_THRESHOLD === 0) {
                                statusEl.innerText += " (Anti-Ban Reset)";
                                console.log("Resetting session...");
                            }
                        }
                    }
                    
                    btn.disabled = false;
                    if(!isRunning && attempts >= maxAttempts) {
                        statusEl.innerText = "Max Attempts Reached.";
                    }
                }
            </script>
        </body>
        </html>
        HTMLEOF

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon
      
    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: AmmarAlHilali-App
        path: app/build/outputs/apk/debug/app-debug.apk
